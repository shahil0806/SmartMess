services:
  - type: web
    name: smartmess
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: GOOGLE_SHEET_URL
        sync: false
      - key: COOKIE_SECURE
        value: "1"
